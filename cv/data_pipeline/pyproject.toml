[project]
name = "mgts-dataset-pipeline"
version = "0.1.0"
description = "Reproducible local normalization for MGTS infrastructure datasets"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.29,<2",
  "Pillow>=10,<13",
  "pyarrow>=17,<24",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=6,<8"]
ui = ["marimo>=0.15,<1"]

[project.scripts]
mgts-datasets = "mgts_data_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mgts_data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["mgts_data_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true
